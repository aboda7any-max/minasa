<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الكيمياء التعليمية</title>
    <!-- استيراد مكتبات Firebase (النسخة المتوافقة مع الكود) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #4338ca; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .alert-success { background-color: #d1fae5; color: #065f46; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
        
        /* تصميم لوحة الإحصائيات بعد تسجيل الدخول */
        #dashboard-view { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f1f5f9; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 24px; color: var(--primary); }
        .stat-card p { margin: 0; font-size: 14px; color: #64748b; }
        .progress-container { background: #e2e8f0; border-radius: 10px; height: 15px; width: 100%; margin: 20px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.5s; }
        .logout-btn { background-color: #ef4444; margin-top: 15px; }
        .logout-btn:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- رسائل التنبيه والنجاح -->
    <div id="alertBox" class="alert"></div>

    <!-- نموذج تسجيل الحساب (يظهر للمستخدم غير المسجل) -->
    <div id="auth-view">
        <h2>تسجيل حساب طالب جديد</h2>
        <div class="form-group">
            <label>اسم الطالب الكامل</label>
            <input type="text" id="studentName" placeholder="اكتب اسمك هنا">
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="studentEmail" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="studentPassword" placeholder="********">
        </div>
        <button onclick="registerStudent()">تسجيل الحساب</button>
    </div>

    <!-- لوحة إحصائيات وحساب الطالب (تظهر بعد تسجيل الدخول) -->
    <div id="dashboard-view">
        <h2 id="welcomeUser">مرحباً بك يا بطل</h2>
        <div style="text-align: center; margin-bottom: 20px; color: #059669; font-weight: bold;" id="statusBadge">حالة الحساب: قيد التفعيل من الأدمن</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="statExams">0</h3>
                <p>الامتحانات المكتملة</p>
            </div>
            <div class="stat-card">
                <h3 id="statScore">0%</h3>
                <p>متوسط الدرجات</p>
            </div>
            <div class="stat-card">
                <h3 id="statVideos">0 / 20</h3>
                <p>الفيديوهات المشاهدة</p>
            </div>
            <div class="stat-card">
                <h3 id="statRank">الثالث الثانوي</h3>
                <p>المرحلة الدراسية</p>
            </div>
        </div>

        <label>نسبة إنجاز الكورس العامة:</label>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p style="text-align: center; font-size: 14px;" id="progressText">تم إنجاز 0% من المحتوى</p>

        <button class="logout-btn" onclick="logoutStudent()">تسجيل الخروج</button>
    </div>
</div>

<script>
  // إعدادات فايربيس الخاصة بمشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyDC9jkwKtFI_EXovBY2ylC5uGwXjdJbu0E",
    authDomain: "platform-dr-abdalrhman.firebaseapp.com",
    databaseURL: "https://platform-dr-abdalrhman-default-rtdb.firebaseio.com",
    projectId: "platform-dr-abdalrhman",
    storageBucket: "platform-dr-abdalrhman.firebasestorage.app",
    messagingSenderId: "832080366938",
    appId: "1:832080366938:web:4275a1a81f3becfa84b763",
    measurementId: "G-DR8CGC8DNE"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const alertBox = document.getElementById("alertBox");

  function showAlert(message, type) {
      alertBox.innerText = message;
      alertBox.className = "alert " + (type === "success" ? "alert-success" : "alert-error");
      alertBox.style.display = "block";
  }

  // وظيفة تسجيل طالب جديد وحفظ بياناته في قاعدة البيانات
  function registerStudent() {
      const name = document.getElementById("studentName").value.trim();
      const email = document.getElementById("studentEmail").value.trim();
      const password = document.getElementById("studentPassword").value.trim();

      if (!name || !email || !password) {
          showAlert("الرجاء ملء جميع الحقول بشكل صحيح!", "error");
          return;
      }

      auth.createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
              const user = userCredential.user;
              // حفظ بيانات الطالب في Firestore ليراها الأدمن مع قيم افتراضية للإحصائيات
              return db.collection("users").doc(user.uid).set({
                  name: name,
                  email: email,
                  status: "pending", // في انتظار التفعيل
                  examsCompleted: 0,
                  averageScore: 0,
                  videosWatched: 0,
                  totalVideos: 20,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
          })
          .then(() => {
              showAlert("تم التسجيل بنجاح! جاري تحويلك للوحة التحكم...", "success");
              setTimeout(loadDashboard, 1500);
          })
          .catch((error) => {
              showAlert("خطأ في التسجيل: " + error.message, "error");
          });
  }

  // مراقبة حالة تسجيل الدخول وعرض لوحة الإحصائيات
  auth.onAuthStateChanged((user) => {
      if (user) {
          loadDashboardData(user.uid);
      }
  });

  function loadDashboard() {
      document.getElementById("auth-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
  }

  function loadDashboardData(uid) {
      db.collection("users").doc(uid).get().then((doc) => {
          if (doc.exists) {
              const data = doc.data();
              document.getElementById("welcomeUser").innerText = "مرحباً، " + data.name;
              document.getElementById("statExams").innerText = data.examsCompleted || 0;
              document.getElementById("statScore").innerText = (data.averageScore || 0) + "%";
              document.getElementById("statVideos").innerText = (data.videosWatched || 0) + " / 20";
              
              // حساب نسبة الإنجاز بناءً على الفيديوهات المشاهدة
              const watched = data.videosWatched || 0;
              const percent = Math.round((watched / 20) * 100);
              document.getElementById("progressBar").style.width = percent + "%";
              document.getElementById("progressText").innerText = "تم إنجاز " + percent + "% من المحتوى";

              loadDashboard();
          }
      });
  }

  // وظيفة تسجيل الخروج
  function logoutStudent() {
      auth.signOut().then(() => {
          document.getElementById("dashboard-view").style.display = "none";
          document.getElementById("auth-view").style.display = "block";
          showAlert("تم تسجيل الخروج بنجاح", "success");
          document.getElementById("studentName").value = "";
          document.getElementById("studentEmail").value = "";
          document.getElementById("studentPassword").value = "";
      });
  }
</script>

</body>
</html>
