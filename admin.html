<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - الدكتور عبدالرحمن هاني</title>
    <!-- مكتبة التصميم Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen">

    <!-- شريط الإدارة العلوى -->
    <nav class="bg-cardBg/90 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <span class="text-xl font-black text-primary">⚙️ لوحة تحكم الأدمن (د. عبدالرحمن)</span>
                </div>
                <div>
                    <span id="adminStatus" class="text-xs bg-primary/20 text-primary border border-primary/30 px-3 py-1.5 rounded-xl font-bold">جاري التحقق من الصلاحيات...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-cardBg border border-gray-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-gray-400 text-sm font-bold mb-1">إجمالي الطلاب المسجلين</h3>
                <p id="totalUsersCount" class="text-3xl font-black text-primary">0</p>
            </div>
            <div class="bg-cardBg border border-gray-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-gray-400 text-sm font-bold mb-1">الحسابات قيد الانتظار</h3>
                <p id="pendingUsersCount" class="text-3xl font-black text-amber-400">0</p>
            </div>
            <div class="bg-cardBg border border-gray-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-gray-400 text-sm font-bold mb-1">حالة قاعدة البيانات</h3>
                <p class="text-sm font-bold text-emerald-400 mt-2">متصل بـ Firebase بنجاح 🟢</p>
            </div>
        </div>

        <!-- جدول إدارة الطلاب -->
        <div class="bg-cardBg border border-gray-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-lg font-bold">إدارة حسابات الطلاب وتفعيلهم</h2>
                <button onclick="loadUsersData()" class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-xl text-xs font-bold text-primary hover:bg-gray-700 transition">تحديث القائمة</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-darkBg/50 text-gray-400 text-xs uppercase border-b border-gray-800">
                            <th class="p-4">اسم الطالب</th>
                            <th class="p-4">رقم الهاتف</th>
                            <th class="p-4">البريد الإلكتروني</th>
                            <th class="p-4">الحالة</th>
                            <th class="p-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-800 text-sm">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">جاري تحميل بيانات الطلاب...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ربط Firebase وتشغيل لوحة التحكم -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDC9jkwKtFI_EXovBY2ylC5uGwXjdJbu0E",
            authDomain: "platform-dr-abdalrhman.firebaseapp.com",
            projectId: "platform-dr-abdalrhman",
            storageBucket: "platform-dr-abdalrhman.firebasestorage.app",
            messagingSenderId: "832080366938",
            appId: "1:832080366938:web:4275a1a81f3becfa84b763",
            measurementId: "G-DR8CGC8DNE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // دالة جلب وعرض بيانات الطلاب في لوحة التحكم
        window.loadUsersData = async function() {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">جاري التحديث...</td></tr>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let total = 0;
                let pending = 0;
                let rowsHtml = '';

                querySnapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    const userId = docSnap.id;
                    total++;
                    
                    const isApproved = user.status === 'active';
                    if (!isApproved) pending++;

                    rowsHtml += `
                        <tr class="hover:bg-gray-800/40 transition">
                            <td class="p-4 font-bold">${user.name || 'غير معروف'}</td>
                            <td class="p-4 text-gray-400">${user.phone || 'بدون'}</td>
                            <td class="p-4 text-gray-400">${user.email || 'بدون'}</td>
                            <td class="p-4">
                                <span class="px-3 py-1 rounded-full text-xs font-bold ${isApproved ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                    ${isApproved ? 'مفعل' : 'قيد الانتظار'}
                                </span>
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="window.toggleUserStatus('${userId}', '${user.status}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${isApproved ? 'bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30' : 'bg-primary/20 text-primary border border-primary/30 hover:bg-primary/30'} transition">
                                    ${isApproved ? 'إلغاء التفعيل' : 'تفعيل الحساب'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('totalUsersCount').innerText = total;
                document.getElementById('pendingUsersCount').innerText = pending;
                tableBody.innerHTML = rowsHtml || `<tr><td colspan="5" class="p-6 text-center text-gray-500">لا توجد حسابات مسجلة حتى الآن.</td></tr>`;
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">خطأ في جلب البيانات: تأكد من صلاحيات قاعدة البيانات.</td></tr>`;
            }
        }

        // دالة تغيير حالة تفعيل الطالب
        window.toggleUserStatus = async function(userId, currentStatus) {
            const newStatus = (currentStatus === 'active') ? 'pending' : 'active';
            try {
                await updateDoc(doc(db, "users", userId), { status: newStatus });
                alert("تم تحديث حالة الطالب بنجاح!");
                loadUsersData();
            } catch (err) {
                alert("حدث خطأ أثناء التحديث: " + err.message);
            }
        }

        // مراقبة حالة الأدمن وتشغيل البيانات عند الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('adminStatus').innerText = "الأدمن متصل (مسؤول النظام)";
                loadUsersData();
            } else {
                document.getElementById('adminStatus').innerText = "يرجى تسجيل الدخول كمسؤول";
                // يمكنك فتح منصة الطلاب وتسجيل الدخول بحساب الأدمن الخاص بك
            }
        });
    </script>
</body>
</html>
